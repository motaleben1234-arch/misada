<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טרטוריה בלה – הזמנת שולחן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#2b2420; --muted:#7a6e66;
    --accent:#a63d2a; --accent-dark:#7f2c1d; --green:#3f6b3a; --line:#e6ddd0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;text-align:center;padding:48px 16px 40px}
  header h1{font-family:'Frank Ruhl Libre',serif;font-size:2.4rem;letter-spacing:1px}
  header p{opacity:.9;margin-top:6px}
  .flag{display:flex;justify-content:center;gap:4px;margin-top:14px}
  .flag span{width:28px;height:5px;border-radius:3px}
  main{max-width:560px;margin:-24px auto 40px;padding:0 16px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:28px 22px}
  h2{font-size:1.3rem;margin-bottom:18px}
  label{display:block;font-weight:500;margin:14px 0 6px;font-size:.95rem}
  input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fffdf9}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
  button:hover{background:var(--accent-dark)}
  .hidden{display:none}
  .done{text-align:center}
  .done .check{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .summary{background:var(--bg);border-radius:12px;padding:14px;margin-top:16px;text-align:right}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .info div{background:var(--card);border-radius:12px;padding:14px;text-align:center;font-size:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .info b{display:block;color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
  .staff-link{color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:0;width:auto;margin:0;padding:0;font-size:.85rem;font-weight:400}
  .staff-link:hover{background:none;color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}
  th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:right}
  th{color:var(--muted);font-weight:500}
  .empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>

<header>
  <h1>טרטוריה בלה</h1>
  <p>מטבח איטלקי ביתי · פסטה טרייה · פיצה מתנור עצים</p>
  <div class="flag"><span style="background:#3f6b3a"></span><span style="background:#fff"></span><span style="background:#e0a090"></span></div>
</header>

<main>
  <!-- טופס הזמנה -->
  <div class="card" id="formCard">
    <h2>הזמנת שולחן</h2>
    <form id="bookingForm">
      <label for="name">שם מלא</label>
      <input id="name" required placeholder="לדוגמה: דנה כהן">

      <label for="phone">טלפון נייד</label>
      <input id="phone" type="tel" required placeholder="050-0000000" pattern="0[0-9\-]{8,11}">

      <div class="row">
        <div>
          <label for="date">תאריך</label>
          <input id="date" type="date" required>
        </div>
        <div>
          <label for="time">שעה</label>
          <select id="time" required></select>
        </div>
      </div>

      <label for="guests">מספר סועדים</label>
      <select id="guests" required></select>

      <label for="notes">הערות (לא חובה)</label>
      <textarea id="notes" rows="2" placeholder="יום הולדת, כיסא תינוק, אלרגיות..."></textarea>

      <button type="submit">אישור הזמנה</button>
    </form>
  </div>

  <!-- מסך אישור -->
  <div class="card done hidden" id="doneCard">
    <div class="check">✓</div>
    <h2>ההזמנה התקבלה!</h2>
    <p>נשמח לראותך. נתראה בקרוב 🍝</p>
    <div class="summary" id="summary"></div>
    <button onclick="newBooking()">הזמנה נוספת</button>
  </div>

  <!-- מסך צוות -->
  <div class="card hidden" id="staffCard">
    <h2>הזמנות (מסך צוות)</h2>
    <div id="staffList"></div>
    <button onclick="closeStaff()">חזרה</button>
  </div>

  <div class="info">
    <div><b>שעות פתיחה</b>א׳–ה׳ 12:00–23:00<br>ו׳ 12:00–16:00</div>
    <div><b>כתובת</b>רחוב הדוגמה 1<br>תל אביב</div>
  </div>
</main>

<footer>
  © טרטוריה בלה · <button class="staff-link" onclick="openStaff()">כניסת צוות</button>
</footer>

<script>
  // שעות פנויות
  const timeSel = document.getElementById('time');
  for (let h = 12; h <= 22; h++) {
    ['00','30'].forEach(m => {
      if (h === 22 && m === '30') return;
      const t = `${h}:${m}`;
      timeSel.add(new Option(t, t));
    });
  }
  // מספר סועדים
  const guestSel = document.getElementById('guests');
  for (let g = 1; g <= 12; g++) guestSel.add(new Option(g === 1 ? 'סועד אחד' : `${g} סועדים`, g));
  guestSel.value = 2;

  // תאריך מינימלי = היום
  const dateInput = document.getElementById('date');
  const today = new Date().toISOString().split('T')[0];
  dateInput.min = today; dateInput.value = today;

  function loadBookings(){
    try { return JSON.parse(localStorage.getItem('bookings') || '[]'); } catch(e){ return []; }
  }
  function saveBookings(list){
    try { localStorage.setItem('bookings', JSON.stringify(list)); } catch(e){}
  }
  function show(id){
    ['formCard','doneCard','staffCard'].forEach(c => document.getElementById(c).classList.toggle('hidden', c !== id));
    window.scrollTo({top:0,behavior:'smooth'});
  }

  document.getElementById('bookingForm').addEventListener('submit', e => {
    e.preventDefault();
    const b = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      date: dateInput.value,
      time: timeSel.value,
      guests: guestSel.value,
      notes: document.getElementById('notes').value.trim()
    };
    const list = loadBookings(); list.push(b); saveBookings(list);
    const d = new Date(b.date).toLocaleDateString('he-IL');
    document.getElementById('summary').innerHTML =
      `<b>${b.name}</b><br>📅 ${d} בשעה ${b.time}<br>👥 ${b.guests} סועדים<br>📱 ${b.phone}` +
      (b.notes ? `<br>📝 ${b.notes}` : '');
    show('doneCard');
  });

  function newBooking(){ document.getElementById('bookingForm').reset(); dateInput.value = today; guestSel.value = 2; show('formCard'); }

  function openStaff(){
    const list = loadBookings().sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
    const box = document.getElementById('staffList');
    if (!list.length) { box.innerHTML = '<p class="empty">אין עדיין הזמנות</p>'; }
    else {
      box.innerHTML = '<table><tr><th>תאריך</th><th>שעה</th><th>שם</th><th>סועדים</th><th>טלפון</th></tr>' +
        list.map(b => `<tr><td>${new Date(b.date).toLocaleDateString('he-IL')}</td><td>${b.time}</td><td>${b.name}</td><td>${b.guests}</td><td>${b.phone}</td></tr>`).join('') +
        '</table>';
    }
    show('staffCard');
  }
  function closeStaff(){ show('formCard'); }
</script>
</body>
</html>
